<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saule pleureur</title>
<style>
:root{--bg:#e4e9df;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2630}}
:root[data-theme="dark"]{--bg:#1a2630}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function(){
const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#1a2630';
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bgc=new THREE.Color(dark?0x1a2630:0xe4e9df);
const scene=new THREE.Scene();
scene.background=bgc;scene.fog=new THREE.Fog(bgc,30,80);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label','Saule pleureur en 3D : glisser pour tourner, molette ou pincement pour zoomer');
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,200);
const aniso=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(dark?0x9fb4d6:0xfff6dc,0x607040,dark?1.0:1.0));
const sun=new THREE.DirectionalLight(dark?0xaec4ff:0xffe8b8,dark?1.1:1.2);
sun.position.set(10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-12;sc.right=sc.top=12;sc.near=1;sc.far=60;
sun.shadow.bias=-0.001;sun.shadow.normalBias=.03;scene.add(sun);

let seed=51160926;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const up=V(0,1,0);
const B=[],L=[];
const palette=['#8fb03a','#a0be40','#7fa132','#b0c850','#74962c','#bccf5a'].map(c=>new THREE.Color(c));
function perp(d,k){return V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize().multiplyScalar(k)}
const posAt=(b,t)=>b.p.clone().addScaledVector(b.d,b.len*t).addScaledVector(b.bv,Math.pow(Math.sin(Math.PI*t),2));

// Une lanière pendante : fine tige souple, couverte de feuilles étroites qui pendent
function whip(p){
  const ho=V(p.x,0,p.z).normalize();
  const d=V(ho.x*.25+(rnd()-.5)*.25,-1,ho.z*.25+(rnd()-.5)*.25).normalize();
  const len=Math.max(1.1,(p.y-1.0)*(.55+.45*rnd()));
  const w={p:p.clone(),d,len,r:.014,rt:.004,S:5,whip:true,bv:perp(d,len*.06)};
  B.push(w);
  const pv=perp(d,1),n=Math.round(len*6.5);
  for(let k=0;k<n;k++){
    const t=.04+.96*k/n,sg=k%2?1:-1;
    const dd=d.clone().multiplyScalar(.75).addScaledVector(pv,sg*.6).add(V((rnd()-.5)*.3,(rnd()-.5)*.2,(rnd()-.5)*.3)).normalize();
    L.push({p:posAt(w,t),dir:dd,roll:rnd()*6.28,s:.8+rnd()*.4,c:palette[Math.floor(rnd()*6)]});
  }
}
// Charpente : branches maîtresses qui montent, s'arquent et retombent
function branch(p,d,len,r,dep){
  const b={p,d,len,r,rt:r*.72,S:dep>=2?7:5,bv:perp(d,len*.05).add(V(0,len*(dep>=2?.1:.02),0))};
  B.push(b);
  if(dep<=3){const a0=dep===3?.5:.2,n=Math.max(2,Math.round(len*(1-a0)/.3));for(let k=0;k<n;k++)whip(posAt(b,a0+(1-a0)*(k+rnd()*.7)/n))}
  if(dep===0)return;
  const e=posAt(b,1),n=dep===3?(rnd()<.5?3:2):2;
  for(let i=0;i<n;i++){
    const ax=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
    const nd=d.clone().applyAxisAngle(ax,.5+rnd()*.5);
    nd.y+=dep>=2?.04:-.22;nd.normalize();
    branch(e,nd,len*.76,r*.68,dep-1);
  }
}
const trunk={p:V(0,0,0),d:V(.22,1,.08).normalize(),len:3.4,r:.65,rt:.5,trunk:true,S:14,bv:V(-.35,0,.3)};
B.push(trunk);
const nL=6;
for(let i=0;i<nL;i++){
  const a=i/nL*6.283+rnd()*.5,eps=.45+rnd()*.35;
  const d=V(Math.sin(eps)*Math.cos(a),Math.cos(eps),Math.sin(eps)*Math.sin(a)).normalize();
  branch(posAt(trunk,i===0?.72:1),d,3.8+rnd()*1.1,.3,3);
}
for(let a=0;a<6;a++){
  const t=a/6*6.283+rnd()*.4;
  B.push({p:V(Math.cos(t)*.15,.4,Math.sin(t)*.15),d:V(Math.cos(t)*.85,-.3,Math.sin(t)*.85).normalize(),len:1.2,r:.2,rt:.1,root:true,S:4,bv:perp(V(1,0,0),.1)});
}

// Vent : le tronc reste fixe, les lanières oscillent d'autant plus qu'elles pendent bas et loin de l'axe
const uTime={value:0};
function sway(mat,amp,inst){
  mat.onBeforeCompile=function(s){
    s.uniforms.uTime=uTime;
    s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <project_vertex>',
`vec4 mvPosition=${inst?'instanceMatrix*':''}vec4(transformed,1.0);
float k=smoothstep(1.5,3.5,length(mvPosition.xz))*pow(clamp((8.5-mvPosition.y)/7.0,0.0,1.0),2.0);
float p=sin(uTime*.9+mvPosition.x*.5+mvPosition.z*.35)*.5*k;
mvPosition.x+=p;mvPosition.z+=p*.6;
mvPosition.x+=sin(uTime*2.2+mvPosition.y*1.5+mvPosition.z*1.9)*${amp}*(.3+transformed.y)*step(.1,mvPosition.y);
mvPosition=modelViewMatrix*mvPosition;
gl_Position=projectionMatrix*mvPosition;`);
  };
}

// ---------- ÉCORCE : sillons verticaux qui s'entrelacent, brun clair ----------
function barkTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#857866';g.fillRect(0,0,W,H);
  for(let i=0;i<260;i++){
    g.fillStyle='rgba('+(rnd()<.5?'45,34,24':'165,140,110')+','+(.05+rnd()*.08)+')';
    g.beginPath();g.ellipse(rnd()*W,rnd()*H,6+rnd()*30,20+rnd()*90,0,0,6.3);g.fill();
  }
  g.lineCap='round';
  const wave=(x0,ph,a,f,y0,y1,style,w)=>{
    g.strokeStyle=style;g.lineWidth=w;
    for(const ox of [-W,0,W])for(const oy of [-H,0,H]){
      g.beginPath();
      for(let y=y0;y<=y1;y+=14){
        const x=x0+ox+a*Math.sin(y*f+ph)+(y-y0)*.03*Math.sin(ph);
        y===y0?g.moveTo(x,y+oy):g.lineTo(x,y+oy);
      }
      g.stroke();
    }
  };
  for(let i=0;i<170;i++){
    const x=rnd()*W,y0=rnd()*H,y1=y0+100+rnd()*480,ph=rnd()*6.3,a=6+rnd()*16,f=.005+rnd()*.008;
    wave(x+8,ph,a,f,y0,y1,'rgba(185,160,128,.4)',3+rnd()*5);
    wave(x,ph,a,f,y0,y1,'rgba(38,28,19,.68)',3+rnd()*8);
  }
  for(let i=0;i<110;i++){
    g.fillStyle='rgba(120,140,95,'+(.05+rnd()*.1)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,2+rnd()*9,0,6.3);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;return t;
}
const barkTex=barkTexture();

const P=[],Nm=[],Uv=[],Col=[],Idx=[];
const T=V(0,0,0),a1=V(0,0,0),a2=V(0,0,0),c0=V(0,0,0),prev=V(0,0,0);
B.forEach(b=>{
  const {p,d,len,r,rt,bv}=b;
  const S=b.S,R=r>.25?24:r>.1?14:r>.04?9:6;
  const rep=Math.max(1,Math.round(6.283*r/.6));
  const n1=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
  const vo=rnd(),tint=.82+rnd()*.18,base=P.length/3;
  let vc=0;
  for(let j=0;j<=S;j++){
    const t=j/S;
    c0.copy(p).addScaledVector(d,len*t).addScaledVector(bv,Math.pow(Math.sin(Math.PI*t),2));
    if(j>0)vc+=c0.distanceTo(prev);prev.copy(c0);
    T.copy(d).multiplyScalar(len).addScaledVector(bv,Math.PI*Math.sin(2*Math.PI*t)).normalize();
    a1.copy(n1).addScaledVector(T,-n1.dot(T)).normalize();a2.crossVectors(T,a1);
    for(let k=0;k<=R;k++){
      const th=6.2832*k/R,cs=Math.cos(th),sn=Math.sin(th);
      let rr=r+(rt-r)*t;
      if(b.trunk)rr*=(1+1.1*Math.exp(-t*len*1.3)*(1+.45*Math.cos(7*th+1)))*(1+.1*Math.cos(3*th+t*6));
      const nx=a1.x*cs+a2.x*sn,ny=a1.y*cs+a2.y*sn,nz=a1.z*cs+a2.z*sn;
      const y=c0.y+ny*rr;
      P.push(c0.x+nx*rr,y,c0.z+nz*rr);Nm.push(nx,ny,nz);
      Uv.push(k/R*rep,vc/1.2+vo);
      const ao=tint*Math.min(1,.55+Math.max(y,0)*.5);
      Col.push(b.whip?ao*.85:ao,b.whip?ao*.92:ao*.97,b.whip?ao*.45:ao*.93);
    }
  }
  for(let j=0;j<S;j++)for(let k=0;k<R;k++){
    const a=base+j*(R+1)+k,b2=a+1,c2=a+R+1,d2=c2+1;
    Idx.push(a,b2,c2,b2,d2,c2);
  }
});
const bg=new THREE.BufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
bg.setAttribute('normal',new THREE.Float32BufferAttribute(Nm,3));
bg.setAttribute('uv',new THREE.Float32BufferAttribute(Uv,2));
bg.setAttribute('color',new THREE.Float32BufferAttribute(Col,3));
bg.setIndex(new THREE.Uint32BufferAttribute(Idx,1));
const barkMat=new THREE.MeshStandardMaterial({map:barkTex,bumpMap:barkTex,bumpScale:2,roughness:.95,metalness:0,vertexColors:true});
sway(barkMat,'0.0',false);
const bark=new THREE.Mesh(bg,barkMat);
bark.castShadow=bark.receiveShadow=true;scene.add(bark);

// ---------- FEUILLE : étroite, lancéolée, dessinée une fois puis clonée ----------
function leafTexture(){
  const W=128,H=512,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),cx=W/2,y0=H-4,y1=4;
  const px=u=>y0-(y0-y1)*u;
  const half=u=>u<=0||u>=1?0:W*.47*Math.pow(Math.sin(Math.PI*Math.pow(u,.85)),.9);
  const outline=()=>{
    g.beginPath();g.moveTo(cx,y0);
    for(let u=0;u<=1.0001;u+=.02)g.lineTo(cx+half(u),px(u));
    for(let u=1;u>=-.0001;u-=.02)g.lineTo(cx-half(u),px(u));
    g.closePath();
  };
  outline();
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,'#bcd47a');gr.addColorStop(.5,'#dcec9e');gr.addColorStop(1,'#c4da82');
  g.fillStyle=gr;g.fill();
  g.save();outline();g.clip();
  g.strokeStyle='rgba(70,100,30,.5)';g.lineWidth=7;outline();g.stroke();
  g.lineCap='round';
  for(let i=1;i<14;i++){
    const u=i*.065,w=half(Math.min(.97,u+.1))*.9;
    for(const s of [-1,1]){
      g.strokeStyle='rgba(250,252,225,.75)';g.lineWidth=1.4;
      g.beginPath();g.moveTo(cx,px(u));g.quadraticCurveTo(cx+s*w*.5,px(u+.02),cx+s*w,px(Math.min(.97,u+.1)));g.stroke();
    }
  }
  g.restore();
  g.strokeStyle='#f4f8d0';g.lineWidth=3.5;
  g.beginPath();g.moveTo(cx,y0);g.lineTo(cx,px(.95));g.stroke();
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=aniso;return tex;
}
const leafTex=leafTexture();
const leafGeo=new THREE.PlaneGeometry(.11,.45,1,3);leafGeo.translate(0,.225,0);
(function(){
  const p=leafGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i);
    p.setZ(i,Math.abs(x)*.6-y*y*.9);
  }
  leafGeo.computeVertexNormals();
})();
const leafMat=new THREE.MeshLambertMaterial({map:leafTex,alphaTest:.3,side:THREE.DoubleSide});
sway(leafMat,'0.09',true);
const leafDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:leafTex,alphaTest:.3});
sway(leafDepth,'0.09',true);
const foliage=new THREE.InstancedMesh(leafGeo,leafMat,L.length);
foliage.castShadow=true;foliage.customDepthMaterial=leafDepth;
const m=new THREE.Matrix4(),q=new THREE.Quaternion(),q2=new THREE.Quaternion(),sv=V(1,1,1);
L.forEach((l,i)=>{
  q.setFromUnitVectors(up,l.dir);q.multiply(q2.setFromAxisAngle(up,l.roll));
  m.compose(l.p,q,sv.set(l.s,l.s,l.s));foliage.setMatrixAt(i,m);foliage.setColorAt(i,l.c);
});
scene.add(foliage);

const ground=new THREE.Mesh(new THREE.CircleGeometry(70,64).rotateX(-Math.PI/2),
  new THREE.MeshLambertMaterial({color:dark?0x3c5a35:0x8fae62}));
ground.receiveShadow=true;scene.add(ground);

let th=.6,phi=1.38,rad=24,auto=!still;
const target=V(0,4.2,0),ptr=new Map();let pd=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);auto=false;if(ptr.size===2)pd=dist()});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;ptr.set(e.pointerId,e);
  if(ptr.size===1){th-=dx*.006;phi=Math.min(1.55,Math.max(.25,phi-dy*.005))}
  else if(ptr.size===2){const d=dist();rad=Math.min(45,Math.max(4,rad*pd/d));pd=d}
});
function dist(){const [a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1}
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(45,Math.max(4,rad*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){th+=.1;auto=false}
  if(e.key==='ArrowRight'){th-=.1;auto=false}
  if(e.key==='ArrowUp'){phi=Math.max(.25,phi-.06)}
  if(e.key==='ArrowDown'){phi=Math.min(1.55,phi+.06)}
});
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  const t=clock.getElapsedTime();
  if(!still)uTime.value=t;
  if(auto)th+=.0015;
  const aspect=camera.aspect<1?1/camera.aspect*.8:1,R=rad*Math.max(1,aspect);
  camera.position.set(target.x+R*Math.sin(phi)*Math.sin(th),target.y+R*Math.cos(phi),target.z+R*Math.sin(phi)*Math.cos(th));
  camera.lookAt(target);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
