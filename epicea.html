<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Épicéa</title>
<style>
:root{--bg:#dde4e0;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17222b}}
:root[data-theme="dark"]{--bg:#17222b}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function(){
const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#17222b';
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bgc=new THREE.Color(dark?0x17222b:0xdde4e0);
const scene=new THREE.Scene();
scene.background=bgc;scene.fog=new THREE.Fog(bgc,34,95);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label','Épicéa en 3D : glisser pour tourner, molette ou pincement pour zoomer');
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,250);
const aniso=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(dark?0x9fb4d6:0xf3f6ea,0x4a5a3c,dark?1.0:0.95));
const sun=new THREE.DirectionalLight(dark?0xaec4ff:0xfff0d0,dark?1.1:1.2);
sun.position.set(12,26,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-17;sc.right=sc.top=17;sc.near=1;sc.far=80;
sun.shadow.bias=-0.001;sun.shadow.normalBias=.03;scene.add(sun);

let seed=7041026;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const up=V(0,1,0);
const B=[],L=[],CN=[];
const tints=['#2b5535','#33623b','#3b6e40','#2a4f3a','#2f5e45'].map(c=>new THREE.Color(c));
const fresh=new THREE.Color('#86b858');
function perp(d,k){return V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize().multiplyScalar(k)}
const posAt=(b,t)=>b.p.clone().addScaledVector(b.d,b.len*t).addScaledVector(b.bv,Math.pow(Math.sin(Math.PI*t),2));

function sprigs(p,d,n){
  for(let k=0;k<n;k++){
    const dir=d.clone().add(V((rnd()-.5)*.5,-.12+(rnd()-.5)*.4,(rnd()-.5)*.5)).normalize();
    const last=k===n-1&&rnd()<.35;
    L.push({p:p.clone(),dir,roll:rnd()*6.28,s:.5+rnd()*.3,c:last?fresh:tints[Math.floor(rnd()*5)]});
  }
}
// Un épicéa : tronc droit, verticilles de branches, rameaux latéraux pendants
const H=14,h0=2.8,nW=17;
B.push({p:V(0,0,0),d:V(0,1,0),len:H,r:.5,rt:.03,trunk:true,S:30,bv:V(.18,0,.1)});
for(let w=0;w<nW;w++){
  const f=w/(nW-1),y=h0+(H-h0-.4)*f,nb=Math.max(3,Math.round(7-4*f)),ph=rnd()*6.28;
  for(let i=0;i<nb;i++){
    const a=ph+i/nb*6.283+(rnd()-.5)*.4;
    const len=(4.4*Math.pow(1-f,.85)+.5)*(.85+rnd()*.3);
    const al=-.18+.5*f+(rnd()-.5)*.15;
    const d=V(Math.cos(a)*Math.cos(al),Math.sin(al),Math.sin(a)*Math.cos(al)).normalize();
    const r=.035+.022*len;
    const mb={p:V(0,y+(rnd()-.5)*.15,0),d,len,r,rt:r*.3,S:6,bv:V(0,-len*.1,0).add(perp(d,len*.03))};
    B.push(mb);
    const side=V().crossVectors(d,up).normalize();
    const n=Math.round(len*2.2);
    for(let k=0;k<n;k++){
      const t=.28+.68*(k+rnd()*.5)/n;
      for(const sg of [-1,1]){
        const bl=Math.max(.35,len*(.5*(1-t)+.12)*(.8+rnd()*.4));
        const dd=d.clone().multiplyScalar(.55).addScaledVector(side,sg*.8).add(V(0,-.3,0)).normalize();
        const sb={p:posAt(mb,t),d:dd,len:bl,r:.016,rt:.005,S:3,bv:V(0,-bl*.12,0)};
        B.push(sb);
        const ns=bl>.7?3:2;
        for(let q=0;q<ns;q++)sprigs(posAt(sb,(q+1)/ns*.95),dd,1);
      }
    }
    sprigs(posAt(mb,1),d.clone().add(V(0,.3,0)).normalize(),3);
    if(f>.2&&rnd()<.7)CN.push({p:posAt(mb,.9+rnd()*.1).add(V(0,-.05,0)),yaw:rnd()*6.28,s:.6+rnd()*.3});
  }
}

const uTime={value:0};
function sway(mat,amp,inst){
  mat.onBeforeCompile=function(s){
    s.uniforms.uTime=uTime;
    s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <project_vertex>',
`vec4 mvPosition=${inst?'instanceMatrix*':''}vec4(transformed,1.0);
float h=max(mvPosition.y,0.0);
float w=sin(uTime*.7+mvPosition.x*.15+mvPosition.z*.1)*.0012*h*h;
mvPosition.x+=w;mvPosition.z+=w*.5;
mvPosition.x+=sin(uTime*2.1+mvPosition.y*1.3+mvPosition.x*1.9)*${amp}*(.3+transformed.y)*step(.1,h);
mvPosition=modelViewMatrix*mvPosition;
gl_Position=projectionMatrix*mvPosition;`);
  };
}

// ---------- ÉCORCE : plaques écailleuses brun-rouge ----------
function barkTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#2e2019';g.fillRect(0,0,W,H);
  g.lineJoin='round';
  for(let row=0;row<16;row++)for(let i=0;i<8;i++){
    const cx=i*64+(row%2)*32+(rnd()-.5)*8,cy=row*64+(rnd()-.5)*8;
    const pts=[];for(let k=0;k<9;k++){const a=k/9*6.283,rr=(27+rnd()*8)*(k%2?.92:1);pts.push([Math.cos(a)*rr*1.15,Math.sin(a)*rr*.95])}
    const col='rgb('+(98+rnd()*42|0)+','+(66+rnd()*28|0)+','+(52+rnd()*20|0)+')';
    for(const ox of [-W,0,W])for(const oy of [-H,0,H]){
      g.beginPath();pts.forEach((p,k)=>k?g.lineTo(cx+ox+p[0],cy+oy+p[1]):g.moveTo(cx+ox+p[0],cy+oy+p[1]));g.closePath();
      g.fillStyle=col;g.fill();
      g.strokeStyle='rgba(205,165,130,.22)';g.lineWidth=3;g.stroke();
      g.strokeStyle='rgba(20,12,8,.55)';g.lineWidth=2;g.beginPath();
      g.moveTo(cx+ox-pts[4][0],cy+oy+pts[4][1]);g.lineTo(cx+ox+pts[6][0],cy+oy+pts[6][1]);g.stroke();
    }
  }
  for(let i=0;i<400;i++){
    g.fillStyle='rgba('+(rnd()<.5?'30,20,14':'150,120,95')+','+(.05+rnd()*.07)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,1+rnd()*5,0,6.3);g.fill();
  }
  for(let i=0;i<70;i++){
    g.fillStyle='rgba(130,150,100,'+(.05+rnd()*.08)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,3+rnd()*9,0,6.3);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;return t;
}
const barkTex=barkTexture();

const P=[],Nm=[],Uv=[],Col=[],Idx=[];
const T=V(0,0,0),a1=V(0,0,0),a2=V(0,0,0),c0=V(0,0,0),prev=V(0,0,0);
B.forEach(b=>{
  const {p,d,len,r,rt,bv}=b;
  const S=b.S,R=r>.25?24:r>.1?14:r>.04?9:6;
  const rep=Math.max(1,Math.round(6.283*r/.6));
  const n1=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
  const vo=rnd(),tint=.8+rnd()*.2,base=P.length/3;
  let vc=0;
  for(let j=0;j<=S;j++){
    const t=j/S;
    c0.copy(p).addScaledVector(d,len*t).addScaledVector(bv,Math.pow(Math.sin(Math.PI*t),2));
    if(j>0)vc+=c0.distanceTo(prev);prev.copy(c0);
    T.copy(d).multiplyScalar(len).addScaledVector(bv,Math.PI*Math.sin(2*Math.PI*t)).normalize();
    a1.copy(n1).addScaledVector(T,-n1.dot(T)).normalize();a2.crossVectors(T,a1);
    for(let k=0;k<=R;k++){
      const th=6.2832*k/R,cs=Math.cos(th),sn=Math.sin(th);
      let rr=r+(rt-r)*Math.pow(t,b.trunk?.8:1);
      if(b.trunk)rr*=1+1.0*Math.exp(-t*len*1.2)*(1+.4*Math.cos(7*th+1));
      const nx=a1.x*cs+a2.x*sn,ny=a1.y*cs+a2.y*sn,nz=a1.z*cs+a2.z*sn;
      const y=c0.y+ny*rr;
      P.push(c0.x+nx*rr,y,c0.z+nz*rr);Nm.push(nx,ny,nz);
      Uv.push(k/R*rep,vc/1.2+vo);
      const ao=tint*Math.min(1,.55+Math.max(y,0)*.5);
      Col.push(ao,ao*.97,ao*.93);
    }
  }
  for(let j=0;j<S;j++)for(let k=0;k<R;k++){
    const a=base+j*(R+1)+k,b2=a+1,c2=a+R+1,d2=c2+1;
    Idx.push(a,b2,c2,b2,d2,c2);
  }
});
const bg=new THREE.BufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
bg.setAttribute('normal',new THREE.Float32BufferAttribute(Nm,3));
bg.setAttribute('uv',new THREE.Float32BufferAttribute(Uv,2));
bg.setAttribute('color',new THREE.Float32BufferAttribute(Col,3));
bg.setIndex(new THREE.Uint32BufferAttribute(Idx,1));
const barkMat=new THREE.MeshStandardMaterial({map:barkTex,bumpMap:barkTex,bumpScale:2,roughness:.95,metalness:0,vertexColors:true});
sway(barkMat,'0.0',false);
const bark=new THREE.Mesh(bg,barkMat);
bark.castShadow=bark.receiveShadow=true;scene.add(bark);

// ---------- RAMEAU D'AIGUILLES : dessiné une seule fois, puis cloné ----------
function sprigTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),cx=W/2;
  // cœur du rameau : une masse sombre effilée, pour que le feuillage reste lisible de loin
  g.fillStyle='rgb(78,108,66)';g.beginPath();g.moveTo(cx,H-8);
  for(let y=H-8;y>=80;y-=8){const u=(H-y)/H;g.lineTo(cx+64*Math.sin(Math.PI*Math.min(1,u*1.05))+6,y)}
  for(let y=80;y<=H-8;y+=8){const u=(H-y)/H;g.lineTo(cx-64*Math.sin(Math.PI*Math.min(1,u*1.05))-6,y)}
  g.closePath();g.fill();
  const needle=(x,y,a,len,col)=>{
    const ex=x+Math.sin(a)*len,ey=y-Math.cos(a)*len,nx=Math.cos(a)*2.4,ny=Math.sin(a)*2.4;
    g.fillStyle=col;g.beginPath();g.moveTo(x-nx,y-ny);g.lineTo(ex,ey);g.lineTo(x+nx,y+ny);g.fill();
  };
  // aiguilles fines rayonnant tout autour de la tige : fond sombre puis dessus clair
  for(const layer of [0,1]){
    for(let y=H-24;y>74;y-=layer?5:6){
      const u=(H-y)/H,len=(95+55*Math.sin(Math.PI*Math.min(1,u*1.1)))*(.8+rnd()*.4);
      for(const s of [-1,1]){
        const a=s*(.3+rnd()*(layer?.8:.55)),v=rnd();
        needle(cx+s*rnd()*8,y+rnd()*4,a,len*(layer?1:.85),layer?'rgb('+(165+v*45|0)+','+(200+v*35|0)+','+(125+v*40|0)+')':'rgb('+(95+v*30|0)+','+(128+v*30|0)+','+(82+v*25|0)+')');
      }
    }
  }
  g.strokeStyle='#8a7550';g.lineCap='round';g.lineWidth=8;
  g.beginPath();g.moveTo(cx,H-4);g.lineTo(cx,70);g.stroke();
  for(let i=0;i<16;i++)needle(cx,92,(i/15-.5)*.9,55+rnd()*25,'rgb(205,228,165)');
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=aniso;return tex;
}
const sprigTex=sprigTexture();
function mergeTwo(a,b){
  const n=a.attributes.position.count;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute([...a.attributes.position.array,...b.attributes.position.array],3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute([...a.attributes.uv.array,...b.attributes.uv.array],2));
  g.setIndex([...a.index.array,...[...b.index.array].map(i=>i+n)]);
  g.computeVertexNormals();return g;
}
// deux plans croisés : le rameau a du volume vu sous tous les angles
const sprigGeo=mergeTwo(
  new THREE.PlaneGeometry(.62,1,1,1).translate(0,.5,0),
  new THREE.PlaneGeometry(.62,1,1,1).translate(0,.5,0).rotateY(Math.PI/2));
const sprigMat=new THREE.MeshLambertMaterial({map:sprigTex,alphaTest:.35,side:THREE.DoubleSide});
sway(sprigMat,'0.06',true);
const sprigDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:sprigTex,alphaTest:.35});
sway(sprigDepth,'0.06',true);
const foliage=new THREE.InstancedMesh(sprigGeo,sprigMat,L.length);
foliage.castShadow=true;foliage.customDepthMaterial=sprigDepth;
const m=new THREE.Matrix4(),q=new THREE.Quaternion(),q2=new THREE.Quaternion(),sv=V(1,1,1);
L.forEach((l,i)=>{
  q.setFromUnitVectors(up,l.dir);q.multiply(q2.setFromAxisAngle(up,l.roll));
  m.compose(l.p,q,sv.set(l.s,l.s,l.s));foliage.setMatrixAt(i,m);foliage.setColorAt(i,l.c);
});
scene.add(foliage);

// ---------- CÔNE : un seul modèle, cloné ----------
function coneTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#2a180c';g.fillRect(0,0,256,256);
  for(let j=-1;j<18;j++)for(let i=0;i<17;i++){
    const x=i*16+(j%2)*8,y=j*15,v=rnd()*25|0;
    const gr=g.createLinearGradient(0,y,0,y+22);gr.addColorStop(0,'rgb('+(168+v)+','+(116+v)+',70)');gr.addColorStop(1,'rgb('+(104+v)+','+(66+v)+',38)');
    g.fillStyle=gr;g.beginPath();g.moveTo(x-8,y);g.quadraticCurveTo(x-9,y+20,x,y+23);g.quadraticCurveTo(x+9,y+20,x+8,y);g.closePath();g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.anisotropy=aniso;return t;
}
const coneGeo=new THREE.LatheGeometry(Array.from({length:14},(_,i)=>{const s=i/13;return new THREE.Vector2(.001+.21*Math.pow(Math.sin(Math.PI*Math.pow(s,.7)),.9),-s*1.1)}),16);
const cones=new THREE.InstancedMesh(coneGeo,new THREE.MeshLambertMaterial({map:coneTexture()}),Math.max(CN.length,1));
cones.count=CN.length;cones.castShadow=true;
CN.forEach((c,i)=>{
  q.setFromAxisAngle(up,c.yaw).multiply(q2.setFromAxisAngle(V(1,0,0),(rnd()-.5)*.35));
  m.compose(c.p,q,sv.set(c.s,c.s,c.s));cones.setMatrixAt(i,m);
});
scene.add(cones);

const ground=new THREE.Mesh(new THREE.CircleGeometry(80,64).rotateX(-Math.PI/2),
  new THREE.MeshLambertMaterial({color:dark?0x2b3524:0x6f7656}));
ground.receiveShadow=true;scene.add(ground);

let th=.6,phi=1.38,rad=30,auto=!still;
const target=V(0,6.6,0),ptr=new Map();let pd=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);auto=false;if(ptr.size===2)pd=dist()});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;ptr.set(e.pointerId,e);
  if(ptr.size===1){th-=dx*.006;phi=Math.min(1.55,Math.max(.25,phi-dy*.005))}
  else if(ptr.size===2){const d=dist();rad=Math.min(55,Math.max(5,rad*pd/d));pd=d}
});
function dist(){const [a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1}
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(55,Math.max(5,rad*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){th+=.1;auto=false}
  if(e.key==='ArrowRight'){th-=.1;auto=false}
  if(e.key==='ArrowUp'){phi=Math.max(.25,phi-.06)}
  if(e.key==='ArrowDown'){phi=Math.min(1.55,phi+.06)}
});
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  const t=clock.getElapsedTime();
  if(!still)uTime.value=t;
  if(auto)th+=.0015;
  const aspect=camera.aspect<1?1/camera.aspect*.8:1,R=rad*Math.max(1,aspect);
  camera.position.set(target.x+R*Math.sin(phi)*Math.sin(th),target.y+R*Math.cos(phi),target.z+R*Math.sin(phi)*Math.cos(th));
  camera.lookAt(target);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
