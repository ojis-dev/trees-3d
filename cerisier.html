<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerisier en fleurs</title>
<style>
:root{--bg:#dbe7ee;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function(){
const dark=false; // scène toujours en plein jour : un cerisier en fleurs se regarde en lumière claire
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bgc=new THREE.Color(dark?0x1b2433:0xdbe7ee);
const scene=new THREE.Scene();
scene.background=bgc;scene.fog=new THREE.Fog(bgc,30,100);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
renderer.domElement.setAttribute('aria-label','Cerisier en fleurs en 3D : glisser pour tourner, molette ou pincement pour zoomer');
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,200);
const aniso=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(dark?0xb5c4e6:0xfff8f4,dark?0x4a5a48:0x7f9a62,dark?.85:.6));
const sun=new THREE.DirectionalLight(dark?0xbcd0ff:0xfff6ea,dark?.9:.9);
sun.position.set(11,20,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-18;sc.right=sc.top=18;sc.near=1;sc.far=60;
sun.shadow.bias=-0.001;sun.shadow.normalBias=.03;scene.add(sun);

let seed=33260404;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const up=V(0,1,0),Z=V(0,0,1);
const B=[],L=[];
const petalCols=['#ffffff','#ffffff','#fff6f9','#ffeaf1','#ffdfea'].map(c=>new THREE.Color(c));
const budCols=['#f8c0d0','#f4a9c0','#fbd0dc'].map(c=>new THREE.Color(c));
function perp(d,k){return V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize().multiplyScalar(k)}
const posAt=(b,t)=>b.p.clone().addScaledVector(b.d,b.len*t).addScaledVector(b.bv,Math.pow(Math.sin(Math.PI*t),2));
const crown=V(0,5,0);

// Une fleur par position, serrées le long des rameaux, tournées vers l'extérieur de la couronne
function flowers(b){
  const dens=b.dep<=1?66:b.dep===2?48:26,nc=Math.max(1,Math.round(b.len*dens/4));
  for(let k=0;k<nc;k++){
    const p0=posAt(b,.1+.9*rnd()),rad0=perp(b.d,1);
    p0.addScaledVector(rad0,b.r+.05);
    const m=4+Math.floor(rnd()*3);
    for(let j=0;j<m;j++){
      const p=p0.clone().add(V((rnd()-.5)*.26,(rnd()-.5)*.2-.04,(rnd()-.5)*.26));
      const face=p.clone().sub(crown).normalize().multiplyScalar(.6).addScaledVector(rad0,.25).add(V((rnd()-.5)*.6,-.2+(rnd()-.5)*.5,(rnd()-.5)*.6)).normalize();
      const bud=rnd()<.1;
      L.push({p,face,roll:rnd()*6.28,s:bud?.45+rnd()*.25:.75+rnd()*.45,
        c:bud?budCols[Math.floor(rnd()*3)]:petalCols[Math.floor(Math.pow(rnd(),1.3)*5)]});
    }
  }
}
// Charpente en vase : tronc court, trois maîtresses branches, ramification anguleuse
function grow(p,d,len,r,dep){
  const b={p,d,len,r,rt:r*.74,dep,S:dep>=5?7:dep>=3?5:4,bv:perp(d,len*(.12+.08*rnd()))};
  if(dep===7){b.trunk=true;b.S=12;b.bv=V(-.3,0,.25)}
  B.push(b);
  if(dep<=3)flowers(b);
  if(dep===0)return;
  const e=posAt(b,1),n=dep===7?3:(rnd()<.3?3:2),az0=rnd()*6.28;
  for(let i=0;i<n;i++){
    const main=i===0;
    let nd;
    if(dep===7){
      const az=az0+i/3*6.283+rnd()*.4;
      nd=d.clone().applyAxisAngle(V(-Math.sin(az),0,Math.cos(az)),.65+rnd()*.3);
    }else{
      const ax=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
      nd=d.clone().applyAxisAngle(ax,main?.2+rnd()*.25:.55+rnd()*.5);
    }
    {const ox=e.x,oz=e.z,ol=Math.hypot(ox,oz)||1;nd.x+=ox/ol*.08;nd.z+=oz/ol*.08}nd.y+=dep>3?.16:(dep<=2?-.07:.03);nd.normalize();
    grow(e,nd,len*(main?.84:.78),r*(main?.78:.64),dep-1);
  }
}
grow(V(0,0,0),V(.12,1,.06).normalize(),2.8,.44,7);
for(let a=0;a<6;a++){
  const t=a/6*6.283+rnd()*.4;
  B.push({p:V(Math.cos(t)*.15,.4,Math.sin(t)*.15),d:V(Math.cos(t)*.85,-.3,Math.sin(t)*.85).normalize(),len:1.2,r:.2,rt:.1,root:true,S:4,bv:perp(V(1,0,0),.1)});
}

const uTime={value:0};
function sway(mat,amp,inst){
  mat.onBeforeCompile=function(s){
    s.uniforms.uTime=uTime;
    s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <project_vertex>',
`vec4 mvPosition=${inst?'instanceMatrix*':''}vec4(transformed,1.0);
float h=max(mvPosition.y,0.0);
float w=sin(uTime*.6+mvPosition.x*.2+mvPosition.z*.15)*.0014*h*h;
mvPosition.x+=w;mvPosition.z+=w*.5;
mvPosition.x+=sin(uTime*1.7+mvPosition.y*1.4+mvPosition.z*1.8)*${amp}*step(.1,h);
mvPosition=modelViewMatrix*mvPosition;
gl_Position=projectionMatrix*mvPosition;`);
  };
}

// ---------- ÉCORCE : brun-gris lisse, lenticelles horizontales ----------
function barkTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#4d413b');gr.addColorStop(.5,'#5a4c45');gr.addColorStop(1,'#4d413b');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<240;i++){
    const x=rnd()*W,y=rnd()*H,l=60+rnd()*300;
    g.strokeStyle=rnd()<.5?'rgba(20,14,12,.22)':'rgba(130,112,104,.14)';g.lineWidth=1+rnd()*3;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*10,y+l);g.stroke();
  }
  for(let i=0;i<150;i++){
    const x=rnd()*W,y=rnd()*H,w=7+rnd()*22,h=1.2+rnd()*2;
    for(const ox of [-W,0,W])for(const oy of [-H,0,H]){
      g.fillStyle='rgba(168,150,140,'+(.35+rnd()*.3)+')';
      g.beginPath();g.ellipse(x+ox,y+oy,w,h,0,0,6.3);g.fill();
    }
  }
  for(let i=0;i<40;i++){
    const y=rnd()*H,x=rnd()*W,w=60+rnd()*140;
    g.strokeStyle='rgba(150,132,124,.16)';g.lineWidth=2+rnd()*3;
    for(const ox of [-W,0,W]){g.beginPath();g.moveTo(x+ox,y);g.quadraticCurveTo(x+ox+w/2,y+(rnd()-.5)*8,x+ox+w,y+(rnd()-.5)*4);g.stroke()}
  }
  for(let i=0;i<110;i++){
    g.fillStyle='rgba(150,165,130,'+(.05+rnd()*.09)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,2+rnd()*8,0,6.3);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;return t;
}
const barkTex=barkTexture();

const P=[],Nm=[],Uv=[],Col=[],Idx=[];
const T=V(0,0,0),a1=V(0,0,0),a2=V(0,0,0),c0=V(0,0,0),prev=V(0,0,0);
B.forEach(b=>{
  const {p,d,len,r,rt,bv}=b;
  const S=b.S,R=r>.25?24:r>.1?14:r>.04?9:6;
  const rep=Math.max(1,Math.round(6.283*r/.6));
  const n1=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
  const vo=rnd(),tint=.85+rnd()*.15,base=P.length/3;
  let vc=0;
  for(let j=0;j<=S;j++){
    const t=j/S;
    c0.copy(p).addScaledVector(d,len*t).addScaledVector(bv,Math.pow(Math.sin(Math.PI*t),2));
    if(j>0)vc+=c0.distanceTo(prev);prev.copy(c0);
    T.copy(d).multiplyScalar(len).addScaledVector(bv,Math.PI*Math.sin(2*Math.PI*t)).normalize();
    a1.copy(n1).addScaledVector(T,-n1.dot(T)).normalize();a2.crossVectors(T,a1);
    for(let k=0;k<=R;k++){
      const th=6.2832*k/R,cs=Math.cos(th),sn=Math.sin(th);
      let rr=r+(rt-r)*t;
      if(b.trunk)rr*=(1+.6*Math.exp(-t*len*1.6)*(1+.3*Math.cos(6*th+1)));
      const nx=a1.x*cs+a2.x*sn,ny=a1.y*cs+a2.y*sn,nz=a1.z*cs+a2.z*sn;
      const y=c0.y+ny*rr;
      P.push(c0.x+nx*rr,y,c0.z+nz*rr);Nm.push(nx,ny,nz);
      Uv.push(k/R*rep,vc/1.2+vo);
      const ao=tint*Math.min(1,.55+Math.max(y,0)*.5);
      Col.push(ao,ao*.97,ao*.95);
    }
  }
  for(let j=0;j<S;j++)for(let k=0;k<R;k++){
    const a=base+j*(R+1)+k,b2=a+1,c2=a+R+1,d2=c2+1;
    Idx.push(a,b2,c2,b2,d2,c2);
  }
});
const bg=new THREE.BufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
bg.setAttribute('normal',new THREE.Float32BufferAttribute(Nm,3));
bg.setAttribute('uv',new THREE.Float32BufferAttribute(Uv,2));
bg.setAttribute('color',new THREE.Float32BufferAttribute(Col,3));
bg.setIndex(new THREE.Uint32BufferAttribute(Idx,1));
const barkMat=new THREE.MeshStandardMaterial({map:barkTex,bumpMap:barkTex,bumpScale:.25,roughness:.55,metalness:0,vertexColors:true});
sway(barkMat,'0.0',false);
const bark=new THREE.Mesh(bg,barkMat);
bark.castShadow=bark.receiveShadow=true;scene.add(bark);

function translucent(mat){
  const o=mat.onBeforeCompile;
  mat.onBeforeCompile=function(s){
    if(o)o(s);
    s.fragmentShader=s.fragmentShader
      .replace('( gl_FrontFacing ) ? vLightFront : vLightBack','vLightFront*.8+vLightBack*.6')
      .replace('( gl_FrontFacing ) ? vIndirectFront : vIndirectBack','vIndirectFront*.8+vIndirectBack*.6');
  };
}
// ---------- LA FLEUR : cinq pétales échancrés, étamines ; dessinée une fois puis clonée ----------
function flowerTexture(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),Lp=120,Wp=50;
  for(let k=0;k<5;k++){
    g.save();g.translate(S/2,S/2);g.rotate(k*Math.PI*2/5+.3*(k%2?1:-.4));
    g.beginPath();g.moveTo(5,0);
    g.bezierCurveTo(28,-Wp*.6,Lp*.8,-Wp*1.05,Lp,-11);
    g.quadraticCurveTo(Lp*.98,-4,Lp*.9,0);
    g.quadraticCurveTo(Lp*.98,4,Lp,11);
    g.bezierCurveTo(Lp*.8,Wp*1.05,28,Wp*.6,5,0);g.closePath();
    const gr=g.createLinearGradient(0,0,Lp,0);
    gr.addColorStop(0,'#e0558a');gr.addColorStop(.3,'#f6b4c9');gr.addColorStop(.75,'#fde4ec');gr.addColorStop(1,'#fff8fa');
    g.fillStyle=gr;g.fill();
    g.strokeStyle='rgba(236,150,176,.55)';g.lineWidth=1.6;g.stroke();
    g.strokeStyle='rgba(215,85,130,.32)';g.lineWidth=1.6;
    for(const a of [-.32,-.12,.12,.32]){g.beginPath();g.moveTo(8,0);g.quadraticCurveTo(Lp*.4,a*Lp*.18,Lp*.74,a*Lp*.5);g.stroke()}
    g.restore();
  }
  g.fillStyle='rgba(214,70,120,.85)';g.beginPath();g.arc(S/2,S/2,14,0,6.3);g.fill();
  g.lineCap='round';
  for(let i=0;i<26;i++){
    const a=rnd()*6.283,l=24+rnd()*24,x=S/2+Math.cos(a)*l,y=S/2+Math.sin(a)*l;
    g.strokeStyle='rgba(255,236,242,.95)';g.lineWidth=1.8;g.beginPath();g.moveTo(S/2,S/2);g.lineTo(x,y);g.stroke();
    g.fillStyle=rnd()<.6?'#f2c64a':'#c4305c';g.beginPath();g.arc(x,y,2.8,0,6.3);g.fill();
  }
  g.fillStyle='#b9c95c';g.beginPath();g.arc(S/2,S/2,4,0,6.3);g.fill();
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=aniso;return tex;
}
const flowerTex=flowerTexture();
const flowerGeo=new THREE.PlaneGeometry(.3,.3,2,2);
(function(){
  const p=flowerGeo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,(x*x+y*y)*1.5)}
  flowerGeo.computeVertexNormals();
})();
const flowerMat=new THREE.MeshLambertMaterial({map:flowerTex,alphaTest:.5,side:THREE.DoubleSide,emissive:dark?0x24121a:0x30161f,emissiveIntensity:.25});
sway(flowerMat,'0.05',true);translucent(flowerMat);
const flowerDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:flowerTex,alphaTest:.5});
sway(flowerDepth,'0.05',true);
for(let i=L.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[L[i],L[j]]=[L[j],L[i]]}
const bloom=new THREE.InstancedMesh(flowerGeo,flowerMat,L.length);
bloom.castShadow=true;bloom.customDepthMaterial=flowerDepth;
const m=new THREE.Matrix4(),q=new THREE.Quaternion(),q2=new THREE.Quaternion(),sv=V(1,1,1);
L.forEach((l,i)=>{
  q.setFromUnitVectors(Z,l.face);q.multiply(q2.setFromAxisAngle(Z,l.roll));
  m.compose(l.p,q,sv.set(l.s,l.s,l.s));bloom.setMatrixAt(i,m);bloom.setColorAt(i,l.c);
});
scene.add(bloom);

const ground=new THREE.Mesh(new THREE.CircleGeometry(130,64).rotateX(-Math.PI/2),
  new THREE.MeshLambertMaterial({color:dark?0x33482e:0x7d9a58}));
ground.receiveShadow=true;scene.add(ground);

// Tapis de fleurs tombées au sol, puis fleurs qui tombent : toujours la même fleur clonée
const plainMat=new THREE.MeshLambertMaterial({map:flowerTex,alphaTest:.5,side:THREE.DoubleSide});
translucent(plainMat);
const NG=700,carpet=new THREE.InstancedMesh(flowerGeo,plainMat,NG);
const qx=new THREE.Quaternion().setFromAxisAngle(V(1,0,0),-Math.PI/2);
for(let i=0;i<NG;i++){
  const a=rnd()*6.283,r=Math.pow(rnd(),.75)*11;
  q.setFromAxisAngle(up,rnd()*6.283).multiply(qx);
  const s=.5+rnd()*.5;
  m.compose(V(Math.cos(a)*r,.02+rnd()*.03,Math.sin(a)*r),q,sv.set(s,s,s));
  carpet.setMatrixAt(i,m);carpet.setColorAt(i,petalCols[Math.floor(rnd()*5)]);
}
carpet.receiveShadow=true;scene.add(carpet);

const N=still?0:260,fall=[];
const fMesh=new THREE.InstancedMesh(flowerGeo,plainMat,Math.max(N,1));
fMesh.count=N;
for(let i=0;i<N;i++)fMesh.setColorAt(i,petalCols[Math.floor(rnd()*5)]);
scene.add(fMesh);
function reset(f,first){
  const a=rnd()*6.28,r=Math.sqrt(rnd())*7;
  f.x=Math.cos(a)*r;f.z=Math.sin(a)*r;f.y=first?rnd()*9:6+rnd()*3;
  f.v=.3+rnd()*.35;f.ph=rnd()*6.28;f.rs=1+rnd()*2.2;
}
for(let i=0;i<N;i++){const f={};reset(f,true);fall.push(f)}
const dm=new THREE.Object3D();

let th=.6,phi=1.33,rad=30,auto=!still;
const target=V(0,4.6,0),ptr=new Map();let pd=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);auto=false;if(ptr.size===2)pd=dist()});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;ptr.set(e.pointerId,e);
  if(ptr.size===1){th-=dx*.006;phi=Math.min(1.55,Math.max(.25,phi-dy*.005))}
  else if(ptr.size===2){const d=dist();rad=Math.min(45,Math.max(4,rad*pd/d));pd=d}
});
function dist(){const [a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1}
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(45,Math.max(4,rad*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){th+=.1;auto=false}
  if(e.key==='ArrowRight'){th-=.1;auto=false}
  if(e.key==='ArrowUp'){phi=Math.max(.25,phi-.06)}
  if(e.key==='ArrowDown'){phi=Math.min(1.55,phi+.06)}
});
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

cv.addEventListener('webglcontextlost',e=>e.preventDefault());
cv.addEventListener('webglcontextrestored',()=>location.reload());
renderer.shadowMap.needsUpdate=true;
let fr=-30,acc=0,last=performance.now(),lvl=0;
const clock=new THREE.Clock();
function frame(){
  const now=performance.now();acc+=now-last;last=now;
  if(++fr===45){
    const avg=acc/fr;
    if(avg>34&&lvl<3){
      lvl++;
      bloom.count=Math.floor(L.length*[1,.6,.38,.22][lvl]);
      if(lvl===1){renderer.setPixelRatio(1);resize();}
      if(lvl>=2)fMesh.count=Math.min(fMesh.count,60);
    }
    fr=0;acc=0;
  }
  const t=clock.getElapsedTime();
  if(!still)uTime.value=t;
  if(auto)th+=.0015;
  const aspect=camera.aspect<1?1/camera.aspect*.8:1,R=rad*Math.max(1,aspect);
  camera.position.set(target.x+R*Math.sin(phi)*Math.sin(th),target.y+R*Math.cos(phi),target.z+R*Math.sin(phi)*Math.cos(th));
  camera.lookAt(target);
  for(let i=0;i<N;i++){
    const f=fall[i];
    f.y-=f.v*.016;f.x+=Math.sin(t*.7+f.ph)*.006+.004;f.z+=Math.cos(t*.5+f.ph)*.004;
    if(f.y<.05)reset(f,false);
    dm.position.set(f.x,f.y,f.z);dm.rotation.set(t*f.rs+f.ph,f.ph*2,t*f.rs*.7);dm.scale.setScalar(.55);
    dm.updateMatrix();fMesh.setMatrixAt(i,dm.matrix);
  }
  if(N)fMesh.instanceMatrix.needsUpdate=true;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
