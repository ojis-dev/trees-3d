<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbre</title>
<style>
:root{--bg:#dfe5dc;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2630}}
:root[data-theme="dark"]{--bg:#1c2630}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="three.min.js"></script>
<script>
(function(){
const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#1c2630';
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bgc=new THREE.Color(dark?0x1c2630:0xdfe5dc);
const scene=new THREE.Scene();
scene.background=bgc;scene.fog=new THREE.Fog(bgc,24,62);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label','Arbre en 3D : glisser pour tourner, molette ou pincement pour zoomer');
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,0.1,200);
const aniso=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(dark?0x9fb4d6:0xfff4dc,0x55633f,dark?0.6:0.95));
const sun=new THREE.DirectionalLight(dark?0xaec4ff:0xffe2b0,dark?0.8:1.15);
sun.position.set(9,17,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-13;sc.right=sc.top=13;sc.near=1;sc.far=55;
sun.shadow.bias=-0.0008;scene.add(sun);

let seed=20261003;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const up=V(0,1,0);
const B=[],L=[];
const palette=['#78a84a','#8fbd4e','#a8c653','#cdc65a','#e6b94a','#68a042'].map(c=>new THREE.Color(c));

function perp(d,k){return V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize().multiplyScalar(k)}

function leaves(e,d,n,spread){
  for(let k=0;k<n;k++){
    const o=V(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(2*spread);
    const dir=d.clone().multiplyScalar(.5).add(V(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(1.6));
    dir.y-=.2;dir.normalize();
    L.push({p:e.clone().add(o),dir,roll:rnd()*6.28,s:.75+rnd()*.5,
      c:palette[Math.min(5,Math.floor(Math.pow(rnd(),1.6)*6))]});
  }
}
function grow(p,d,len,r,dep){
  const e=p.clone().addScaledVector(d,len);
  B.push({p,d,len,r,rt:dep===0?r*.35:r*.8,dep,bv:perp(d,len*(dep>=8?.04:.1)).add(V(0,dep<6?-len*.05:0,0))});
  if(dep<=2)leaves(e,d,dep===0?12:4,dep===0?.7:.5);
  if(dep===0)return;
  const n=dep>6?2:(rnd()<.4?3:2);
  for(let i=0;i<n;i++){
    const main=i===0;
    const ang=main?.15+rnd()*.2:.5+rnd()*.55;
    const ax=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
    const nd=d.clone().applyAxisAngle(ax,ang);
    nd.y+=dep>4?.14:-.03;nd.normalize();
    grow(e,nd,len*(main?.85:.72),r*(main?.8:.6),dep-1);
  }
}
function root(p,d,len,r,dep){
  const e=p.clone().addScaledVector(d,len);
  B.push({p,d,len,r,rt:r*.62,dep:0,root:true,bv:perp(d,len*.1)});
  if(dep===0)return;
  for(let i=0;i<2;i++){
    const nd=d.clone().add(V(rnd()-.5,-.1,rnd()-.5).multiplyScalar(.9)).normalize();
    root(e,nd,len*.7,r*.62,dep-1);
  }
}
grow(V(0,0,0),V(0,1,0),3.1,.42,9);
B[0].trunk=true;
for(let a=0;a<7;a++){
  const t=a/7*Math.PI*2+rnd()*.4;
  root(V(Math.cos(t)*.12,.35,Math.sin(t)*.12),V(Math.cos(t)*.85,-.3,Math.sin(t)*.85).normalize(),1.1,.2,2);
}

// Vent : même déplacement pour l'écorce et les feuilles, pour qu'elles restent solidaires
const uTime={value:0};
function sway(mat,amp,inst){
  mat.onBeforeCompile=function(s){
    s.uniforms.uTime=uTime;
    s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <project_vertex>',
`vec4 mvPosition=${inst?'instanceMatrix*':''}vec4(transformed,1.0);
float h=max(mvPosition.y,0.0);
float w=sin(uTime*.7+mvPosition.x*.15+mvPosition.z*.1)*.0022*h*h;
mvPosition.x+=w;mvPosition.z+=w*.5;
mvPosition.x+=sin(uTime*2.3+mvPosition.y*1.7+mvPosition.z*2.1)*${amp}*(.4+transformed.y)*step(.1,h);
mvPosition=modelViewMatrix*mvPosition;
gl_Position=projectionMatrix*mvPosition;`);
  };
}

// ---------- ÉCORCE : texture de sillons + relief, tubes courbes à jonctions continues ----------
function barkTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#6a5441';g.fillRect(0,0,W,H);
  for(let i=0;i<260;i++){
    g.fillStyle='rgba('+(rnd()<.5?'40,30,22':'135,112,86')+','+(.05+rnd()*.08)+')';
    g.beginPath();g.ellipse(rnd()*W,rnd()*H,6+rnd()*30,20+rnd()*90,0,0,6.3);g.fill();
  }
  g.lineCap='round';
  const wave=(x0,ph,a,f,y0,y1,style,w)=>{
    g.strokeStyle=style;g.lineWidth=w;
    for(const ox of [-W,0,W])for(const oy of [-H,0,H]){
      g.beginPath();
      for(let y=y0;y<=y1;y+=14){
        const x=x0+ox+a*Math.sin(y*f+ph)+(y-y0)*.02*Math.sin(ph);
        y===y0?g.moveTo(x,y+oy):g.lineTo(x,y+oy);
      }
      g.stroke();
    }
  };
  for(let i=0;i<150;i++){
    const x=rnd()*W,y0=rnd()*H,y1=y0+80+rnd()*420,ph=rnd()*6.3,a=4+rnd()*12,f=.006+rnd()*.01;
    wave(x+8,ph,a,f,y0,y1,'rgba(160,135,105,.38)',3+rnd()*4);
    wave(x,ph,a,f,y0,y1,'rgba(22,15,10,.72)',3+rnd()*7);
  }
  g.lineWidth=1;
  for(let i=0;i<300;i++){
    g.strokeStyle='rgba(25,18,12,.35)';g.lineWidth=1+rnd()*2;
    const x=rnd()*W,y=rnd()*H;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*26,y+(rnd()-.5)*8);g.stroke();
  }
  for(let i=0;i<120;i++){
    g.fillStyle='rgba(120,140,95,'+(.05+rnd()*.1)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,2+rnd()*9,0,6.3);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;return t;
}
const barkTex=barkTexture();

const P=[],Nm=[],Uv=[],Col=[],Idx=[];
const T=V(0,0,0),a1=V(0,0,0),a2=V(0,0,0),c0=V(0,0,0),prev=V(0,0,0);
B.forEach(b=>{
  const {p,d,len,r,rt,bv,dep}=b;
  const S=b.root?4:b.trunk?12:dep>=7?5:dep>=4?4:3;
  const R=r>.25?24:r>.1?14:r>.04?9:6;
  const rep=Math.max(1,Math.round(6.283*r/.6));
  const n1=V(rnd()-.5,rnd()-.5,rnd()-.5).cross(d).normalize();
  const vo=rnd(),tint=.82+rnd()*.18,base=P.length/3;
  let vc=0;
  for(let j=0;j<=S;j++){
    const t=b.trunk?Math.pow(j/S,1.5):j/S;
    c0.copy(p).addScaledVector(d,len*t).addScaledVector(bv,Math.pow(Math.sin(Math.PI*t),2));
    if(j>0)vc+=c0.distanceTo(prev);prev.copy(c0);
    T.copy(d).multiplyScalar(len).addScaledVector(bv,Math.PI*Math.sin(2*Math.PI*t)).normalize();
    a1.copy(n1).addScaledVector(T,-n1.dot(T)).normalize();a2.crossVectors(T,a1);
    for(let k=0;k<=R;k++){
      const th=6.2832*k/R,cs=Math.cos(th),sn=Math.sin(th);
      let rr=r+(rt-r)*t;
      if(b.trunk)rr*=1+1.1*Math.exp(-t*len*1.3)*(1+.45*Math.cos(7*th+1));
      const nx=a1.x*cs+a2.x*sn,ny=a1.y*cs+a2.y*sn,nz=a1.z*cs+a2.z*sn;
      const y=c0.y+ny*rr;
      P.push(c0.x+nx*rr,y,c0.z+nz*rr);Nm.push(nx,ny,nz);
      Uv.push(k/R*rep,vc/1.2+vo);
      const ao=tint*Math.min(1,.5+Math.max(y,0)*.6);
      Col.push(ao,ao*.97,ao*.92);
    }
  }
  for(let j=0;j<S;j++)for(let k=0;k<R;k++){
    const a=base+j*(R+1)+k,b2=a+1,c2=a+R+1,d2=c2+1;
    Idx.push(a,b2,c2,b2,d2,c2);
  }
});
const bg=new THREE.BufferGeometry();
bg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
bg.setAttribute('normal',new THREE.Float32BufferAttribute(Nm,3));
bg.setAttribute('uv',new THREE.Float32BufferAttribute(Uv,2));
bg.setAttribute('color',new THREE.Float32BufferAttribute(Col,3));
bg.setIndex(new THREE.Uint32BufferAttribute(Idx,1));
const barkMat=new THREE.MeshStandardMaterial({map:barkTex,bumpMap:barkTex,bumpScale:2,roughness:.95,metalness:0,vertexColors:true});
sway(barkMat,'0.0',false);
const bark=new THREE.Mesh(bg,barkMat);
bark.castShadow=bark.receiveShadow=true;scene.add(bark);

// ---------- FEUILLE : dessinée une seule fois, puis clonée par instanciation ----------
function leafTexture(){
  const W=512,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d'),cx=W/2,y0=H-10,y1=10,t0=.12;
  const px=t=>y0-(y0-y1)*t;
  const half=t=>{
    const u=(t-t0)/(1-t0);if(u<=0||u>=1)return 0;
    return W*.46*Math.pow(Math.sin(Math.PI*Math.pow(u,.72)),.9)*(1+.05*((u*26)%1));
  };
  const outline=()=>{
    g.beginPath();g.moveTo(cx,px(t0));
    for(let t=t0;t<=1.0001;t+=.01)g.lineTo(cx+half(t),px(t));
    for(let t=1;t>=t0-.0001;t-=.01)g.lineTo(cx-half(t),px(t));
    g.closePath();
  };
  outline();
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,'#a2c070');gr.addColorStop(.5,'#c2da8a');gr.addColorStop(1,'#a0be6e');
  g.fillStyle=gr;g.fill();
  g.save();outline();g.clip();
  g.strokeStyle='rgba(50,80,26,.65)';g.lineWidth=36;outline();g.stroke();
  for(let i=0;i<700;i++){
    g.fillStyle=(rnd()<.5?'rgba(70,105,35,':'rgba(225,238,170,')+(.04+rnd()*.07)+')';
    g.beginPath();g.arc(rnd()*W,rnd()*H,3+rnd()*12,0,6.3);g.fill();
  }
  // réseau fin de nervilles entre les nervures
  g.lineCap='round';g.lineWidth=1.6;
  for(let i=0;i<1400;i++){
    const x=rnd()*W,y=rnd()*H,a=rnd()*6.3,l=10+rnd()*22;
    g.strokeStyle='rgba(238,247,200,'+(.14+rnd()*.14)+')';
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  // nervures latérales : ombre sombre sous un trait clair, qui s'affine vers la pointe
  for(let i=0;i<9;i++){
    const t=t0+.04+i*.095,te=Math.min(.97,t+.15),w=half(te)*.92,wid=7-i*.5;
    for(const s of [-1,1]){
      for(const [col,lw,off] of [['rgba(60,92,30,.5)',wid+5,3],['rgba(250,253,228,.97)',wid,0]]){
        g.strokeStyle=col;g.lineWidth=Math.max(1.5,lw);
        g.beginPath();g.moveTo(cx,px(t)+off);
        g.quadraticCurveTo(cx+s*w*.55,px(t+.03)+off,cx+s*w,px(te)+off);g.stroke();
      }
    }
  }
  g.restore();
  // nervure centrale effilée + pétiole
  g.fillStyle='rgba(60,92,30,.5)';
  g.beginPath();g.moveTo(cx-11,y0);g.lineTo(cx+11,y0);g.lineTo(cx+2,px(.96));g.lineTo(cx-2,px(.96));g.fill();
  g.fillStyle='#f6f9d6';
  g.beginPath();g.moveTo(cx-8,y0);g.lineTo(cx+8,y0);g.lineTo(cx+1.5,px(.96));g.lineTo(cx-1.5,px(.96));g.fill();
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=aniso;return tex;
}
const leafTex=leafTexture();
const leafGeo=new THREE.PlaneGeometry(.62,1,4,6);leafGeo.translate(0,.5,0);
(function(){
  const p=leafGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i);
    p.setZ(i,x*x*1.5-y*y*.45-Math.abs(x)*y*.25);
  }
  leafGeo.computeVertexNormals();
})();
const leafMat=new THREE.MeshLambertMaterial({map:leafTex,alphaTest:.5,side:THREE.DoubleSide});
sway(leafMat,'0.07',true);
const leafDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:leafTex,alphaTest:.5});
sway(leafDepth,'0.07',true);
const foliage=new THREE.InstancedMesh(leafGeo,leafMat,L.length);
foliage.castShadow=true;foliage.customDepthMaterial=leafDepth;
const m=new THREE.Matrix4(),q=new THREE.Quaternion(),q2=new THREE.Quaternion(),sv=V(1,1,1);
L.forEach((l,i)=>{
  q.setFromUnitVectors(up,l.dir);q.multiply(q2.setFromAxisAngle(up,l.roll));
  m.compose(l.p,q,sv.set(l.s,l.s,l.s));foliage.setMatrixAt(i,m);foliage.setColorAt(i,l.c);
});
scene.add(foliage);

const ground=new THREE.Mesh(new THREE.CircleGeometry(60,64).rotateX(-Math.PI/2),
  new THREE.MeshLambertMaterial({color:dark?0x34452f:0x8a9a62}));
ground.receiveShadow=true;scene.add(ground);

const N=still?0:46,fall=[];
const fMesh=new THREE.InstancedMesh(leafGeo,new THREE.MeshLambertMaterial({map:leafTex,color:0xe6b94a,alphaTest:.5,side:THREE.DoubleSide}),Math.max(N,1));
fMesh.count=N;scene.add(fMesh);
function reset(f,first){
  const a=rnd()*6.28,r=Math.sqrt(rnd())*5;
  f.x=Math.cos(a)*r;f.z=Math.sin(a)*r;f.y=first?rnd()*10:7+rnd()*4;
  f.v=.35+rnd()*.35;f.ph=rnd()*6.28;f.rs=1+rnd()*2;
}
for(let i=0;i<N;i++){const f={};reset(f,true);fall.push(f)}
const dm=new THREE.Object3D();

let th=.6,phi=1.3,rad=19,auto=!still;
const target=V(0,5.4,0),ptr=new Map();let pd=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);auto=false;if(ptr.size===2)pd=dist()});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;ptr.set(e.pointerId,e);
  if(ptr.size===1){th-=dx*.006;phi=Math.min(1.55,Math.max(.25,phi-dy*.005))}
  else if(ptr.size===2){const d=dist();rad=Math.min(36,Math.max(5,rad*pd/d));pd=d}
});
function dist(){const [a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1}
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(36,Math.max(5,rad*(1+e.deltaY*.001)))},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){th+=.1;auto=false}
  if(e.key==='ArrowRight'){th-=.1;auto=false}
  if(e.key==='ArrowUp'){phi=Math.max(.25,phi-.06)}
  if(e.key==='ArrowDown'){phi=Math.min(1.55,phi+.06)}
});
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function frame(){
  const t=clock.getElapsedTime();
  if(!still)uTime.value=t;
  if(auto)th+=.0015;
  const aspect=camera.aspect<1?1/camera.aspect*.75:1,R=rad*Math.max(1,aspect);
  camera.position.set(target.x+R*Math.sin(phi)*Math.sin(th),target.y+R*Math.cos(phi),target.z+R*Math.sin(phi)*Math.cos(th));
  camera.lookAt(target);
  for(let i=0;i<N;i++){
    const f=fall[i];
    f.y-=f.v*.016;f.x+=Math.sin(t*.8+f.ph)*.004;f.z+=Math.cos(t*.6+f.ph)*.003;
    if(f.y<.05)reset(f,false);
    dm.position.set(f.x,f.y,f.z);dm.rotation.set(t*f.rs+f.ph,f.ph,t*f.rs*.6);dm.scale.setScalar(.6);
    dm.updateMatrix();fMesh.setMatrixAt(i,dm.matrix);
  }
  if(N)fMesh.instanceMatrix.needsUpdate=true;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
